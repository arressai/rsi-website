<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic Gallery — Arressai</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Overlay header -->
  <header class="hero-header">
    <div class="hero-header-top">
      <a href="index.html" class="logo-link">
        <img src="logo-seven.png" alt="Arressai" class="site-logo" />
      </a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link">WORK</a>

  <main class="main-content sonic-landing">
    <section class="projects-container sonic-left">
      <!-- <div class="sonic-header">
        <h1 class="sonic-title">SONIC GALLERY</h1>
        <p class="sonic-description">Interactive sound installation. Click falling objects to play sounds. Move your mouse up and down to modulate frequencies.</p>
      </div> -->
    </section>

    <!-- Right side sonic gallery -->
    <div class="sonic-gallery-right" id="sonicGallery">
      <div class="sonic-item" data-sound="womansaying-no.wav" data-filter="lowpass">
        <img src="pierogi.png" alt="Sonic Element 1" />

      <div class="sonic-item" data-sound="sound-2.mp3" data-filter="lowpass">
        <img src="pierogi.png" alt="Sonic Element 2" />
      </div>
      <div class="sonic-item" data-sound="sound-3.mp3" data-filter="highpass">
        <img src="pierogi.png" alt="Sonic Element 3" />
      </div>
      <div class="sonic-item" data-sound="sound-4.mp3" data-filter="highpass">
        <img src="pierogi.png" alt="Sonic Element 4" />
      </div>
      <div class="sonic-item" data-sound="sound-5.mp3" data-filter="lowpass">
        <img src="pierogi.png" alt="Sonic Element 5" />
      </div>
      <div class="sonic-item" data-sound="sound-6.mp3" data-filter="highpass">
        <img src="sun-four.png" alt="Sonic Element 6" />
      </div>
      <div class="sonic-item" data-sound="sound-1.mp3" data-filter="lowpass">
        <img src="pierogi3.png" alt="Sonic Element 7" />
      </div>
      <div class="sonic-item" data-sound="sound-2.mp3" data-filter="highpass">
        <img src="sun-four.png" alt="Sonic Element 8" />
      </div>
      <div class="sonic-item" data-sound="sound-3.mp3" data-filter="lowpass">
        <img src="pierogi3.png" alt="Sonic Element 9" />
      </div>
      <div class="sonic-item" data-sound="sound-4.mp3" data-filter="highpass">
        <img src="pierogi.png" alt="Sonic Element 10" />
      </div>
    </div>
  </main>

  <!-- Controls -->
  <div class="sonic-controls-right">
    <button id="toggleSound" class="sonic-btn">SOUND ON</button>
    <button id="resetGallery" class="sonic-btn">RESET</button>
  </div>

  <footer class="site-footer">
    <p>Sonic environments, installations and experiences exploring the intersection of sound, matter, and consciousness.</p>
    <div class="footer-nav">
      <a href="https://www.instagram.com/arressai/" target="_blank">INSTAGRAM</a>
